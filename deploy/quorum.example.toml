# Quorum server config. Copy to /etc/quorum/quorum.toml (path overridable with QUORUM_CONFIG).
# The master key for stored secrets comes from the environment, never from this file:
#   QUORUM_SECRET_KEY = 32 random bytes, base64 (openssl rand -base64 32)

[server]
bind = "0.0.0.0:8080"
# The address clients use (Tailscale name). `https://` enables Secure cookies.
public_url = "https://quorum.your-tailnet.ts.net"
database = "/var/lib/quorum/quorum.db"
# Optional: services imported once on first start (see services.seed.example.toml).
# seed = "/etc/quorum/services.seed.toml"

# Alerts to ntfy. If the topic needs an access token, put it in the environment as
# QUORUM_NTFY_TOKEN (e.g. in /etc/quorum/quorum.env), not here.
# Quiet hours use this server's local time zone.
# [ntfy]
# url = "https://ntfy.example.lan"
# topic = "quorum"

# Used from phase 6 (iOS push).
# [apns]
# enabled = true
# team_id = "ABCDE12345"
# key_id = "XYZ987WVUT"
# key_path = "/etc/quorum/AuthKey_XYZ987WVUT.p8"   # file mode 600, never committed
# bundle_id = "com.example.quorum"
# environment = "production"                        # or "sandbox" for Xcode debug builds
