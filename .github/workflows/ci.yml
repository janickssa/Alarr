name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  backend:
    name: Backend (fmt, clippy, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  agent:
    name: Agent (fmt, clippy, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: agent
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: sh -n deploy/install.sh

  web:
    name: Web (lint, check, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Generated API client matches openapi/openapi.json
        run: |
          npm run gen:api
          if ! git diff --exit-code -- src/lib/api/schema.d.ts; then
            echo "::error::web/src/lib/api/schema.d.ts is stale. Run 'npm run gen:api' in web/ and commit."
            exit 1
          fi
      - run: npm run lint
      - run: npm run check
      - run: npm run build

  openapi:
    name: OpenAPI spec is up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - name: Regenerate openapi/openapi.json
        working-directory: backend
        run: cargo run --locked --quiet -- openapi > ../openapi/openapi.json
      - name: Fail if it differs from the committed file
        run: |
          if ! git diff --exit-code -- openapi/openapi.json; then
            echo "::error::openapi/openapi.json is stale. Run 'cargo run -- openapi > ../openapi/openapi.json' in backend/ and commit."
            exit 1
          fi
