# XcodeGen spec: `brew install xcodegen && xcodegen generate` writes Quorum.xcodeproj
# (not committed). See README.md.
name: Quorum
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
configFiles:
  Debug: Config/Shared.xcconfig
  Release: Config/Shared.xcconfig
packages:
  QuorumKit:
    path: QuorumKit
targets:
  Quorum:
    type: application
    platform: iOS
    sources:
      - Quorum
    dependencies:
      - package: QuorumKit
        product: QuorumKit
      - target: QuorumWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(QUORUM_BUNDLE_ID)
        PRODUCT_NAME: Quorum
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
    info:
      path: Quorum/Info.plist
      properties:
        CFBundleDisplayName: Quorum
        QuorumAppGroup: $(QUORUM_APP_GROUP)
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: Scan the pairing QR code shown in Quorum on your computer.
        CFBundleURLTypes:
          - CFBundleURLName: quorum
            CFBundleURLSchemes: [quorum]
        UIBackgroundModes: [remote-notification]
        NSAppTransportSecurity:
          # Plain HTTP only to local-network addresses; use HTTPS on the tailnet
          # (tailscale serve / tailscale cert), see README.md.
          NSAllowsLocalNetworking: true
    entitlements:
      path: Quorum/Quorum.entitlements
      properties:
        aps-environment: development
        com.apple.security.application-groups: [$(QUORUM_APP_GROUP)]
        com.apple.developer.usernotifications.time-sensitive: true
  QuorumWidgets:
    type: app-extension
    platform: iOS
    sources:
      - QuorumWidgets
    dependencies:
      - package: QuorumKit
        product: QuorumKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(QUORUM_BUNDLE_ID).widgets
        PRODUCT_NAME: QuorumWidgets
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: QuorumWidgets/Info.plist
      properties:
        CFBundleDisplayName: Quorum
        QuorumAppGroup: $(QUORUM_APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: QuorumWidgets/QuorumWidgets.entitlements
      properties:
        com.apple.security.application-groups: [$(QUORUM_APP_GROUP)]
schemes:
  Quorum:
    build:
      targets:
        Quorum: all
        QuorumWidgets: all
    run:
      config: Debug
    archive:
      config: Release
